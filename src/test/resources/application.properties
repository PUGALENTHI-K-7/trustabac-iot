spring.application.name=trustabac-iot-test

# Test Database Configuration (H2 In-Memory in MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:trustabac_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# TrustABAC-IoT Domain & Dynamic Trust Engine Configuration (Gate 2)
trustabac.device.default-trust=80.0
trustabac.trust.initial-score=80.0
trustabac.trust.minimum-score=0.0
trustabac.trust.maximum-score=100.0
trustabac.trust.delta.normal-success=1.0
trustabac.trust.delta.suspicious-activity=-10.0
trustabac.trust.delta.request-flooding=-25.0
trustabac.trust.delta.confirmed-malicious=-40.0
trustabac.trust.delta.recovery=10.0

# TrustABAC-IoT Contextual Risk Engine Configuration (Gate 3)
trustabac.risk.minimum-score=0.0
trustabac.risk.maximum-score=100.0
trustabac.risk.low-threshold=30.0
trustabac.risk.medium-threshold=70.0
trustabac.risk.weights.time=10.0
trustabac.risk.weights.location=15.0
trustabac.risk.weights.sensitivity=20.0
trustabac.risk.weights.frequency=20.0
trustabac.risk.weights.network=15.0
trustabac.risk.weights.violations=10.0
trustabac.risk.weights.behavior=10.0
trustabac.risk.context.normal-start-hour=0
trustabac.risk.context.normal-end-hour=24
trustabac.risk.context.default-expected-location=Property-001
trustabac.risk.context.frequency-low-threshold=5
trustabac.risk.context.frequency-high-threshold=20
trustabac.risk.context.violation-low-threshold=1
trustabac.risk.context.violation-high-threshold=5

# TrustABAC-IoT Smart-Contract Blockchain Configuration (Gate 4)
trustabac.blockchain.rpc-url=http://127.0.0.1:8545
trustabac.blockchain.chain-id=1337
trustabac.blockchain.contract-address=
trustabac.blockchain.private-key=
trustabac.blockchain.gas-limit=3000000
trustabac.blockchain.gas-price=20000000000
trustabac.blockchain.enabled=true

# TrustABAC-IoT Messaging Configuration (Disabled for unit test harness)
trustabac.messaging.enabled=false

# Spring Batch Configuration (Phase 7F)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
trustabac.batch.enabled=true
trustabac.batch.chunk-size=100
trustabac.batch.default-period-days=30

# Exclude RabbitMQ auto-configuration for unit tests
spring.autoconfigure.exclude=org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration


