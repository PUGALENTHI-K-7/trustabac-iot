spring.application.name=trustabac-iot
server.port=8090

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trustabac_iot}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# TrustABAC-IoT Domain & Dynamic Trust Engine Configuration (Gate 2)
trustabac.device.default-trust=80.0
trustabac.trust.initial-score=80.0
trustabac.trust.minimum-score=0.0
trustabac.trust.maximum-score=100.0
trustabac.trust.delta.normal-success=1.0
trustabac.trust.delta.suspicious-activity=-10.0
trustabac.trust.delta.request-flooding=-25.0
trustabac.trust.delta.confirmed-malicious=-40.0
trustabac.trust.delta.recovery=10.0

# TrustABAC-IoT Contextual Risk Engine Configuration (Gate 3)
trustabac.risk.minimum-score=0.0
trustabac.risk.maximum-score=100.0
trustabac.risk.low-threshold=30.0
trustabac.risk.medium-threshold=70.0
trustabac.risk.weights.time=10.0
trustabac.risk.weights.location=15.0
trustabac.risk.weights.sensitivity=20.0
trustabac.risk.weights.frequency=20.0
trustabac.risk.weights.network=15.0
trustabac.risk.weights.violations=10.0
trustabac.risk.weights.behavior=10.0
# NOTE (v1.1.0): Time risk factor is intentionally configured to contribute zero risk
# during the frozen Phase 8B experiment campaign by using normal-hours = 00:00-24:00.
# This was a deliberate experimental configuration choice to isolate other risk factors.
# A future experiment (not part of the frozen Phase 8B dataset) may evaluate time risk
# by setting normal-start-hour=6 and normal-end-hour=22.
trustabac.risk.context.normal-start-hour=0
trustabac.risk.context.normal-end-hour=24
trustabac.risk.context.default-expected-location=Property-001
trustabac.risk.context.frequency-low-threshold=5
trustabac.risk.context.frequency-high-threshold=20
trustabac.risk.context.violation-low-threshold=1
trustabac.risk.context.violation-high-threshold=5

# TrustABAC-IoT Smart-Contract Blockchain Configuration (Gate 4)
trustabac.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
trustabac.blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:1337}
trustabac.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
trustabac.blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
trustabac.blockchain.gas-limit=3000000
trustabac.blockchain.gas-price=20000000000
trustabac.blockchain.enabled=true

# RabbitMQ Message Broker Configuration (Phase 7C)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

trustabac.messaging.enabled=true
trustabac.messaging.exchange=trustabac.events
trustabac.messaging.device-event-queue=trustabac.device.events
trustabac.messaging.trust-event-queue=trustabac.trust.events
trustabac.messaging.risk-event-queue=trustabac.risk.events
trustabac.messaging.authorization-event-queue=trustabac.authorization.events
trustabac.messaging.dlq-queue=trustabac.dlq
trustabac.messaging.routing-key-device-operation=device.operation
trustabac.messaging.routing-key-trust-event=trust.event
trustabac.messaging.routing-key-risk-event=risk.context
trustabac.messaging.routing-key-authorization-result=authorization.result
trustabac.messaging.routing-key-dlq=dlq.events

# WebSocket / STOMP Real-Time Telemetry Streaming Configuration (Phase 7D)
trustabac.websocket.enabled=true
trustabac.websocket.endpoint=/ws
trustabac.websocket.topic-prefix=/topic
trustabac.websocket.app-prefix=/app
trustabac.websocket.allowed-origins=*

# Spring Batch Configuration (Phase 7F - Offline Analytics & Auditing)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

trustabac.batch.enabled=true
trustabac.batch.chunk-size=100
trustabac.batch.default-period-days=30


