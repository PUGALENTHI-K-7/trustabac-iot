version: '3.8'

services:
  # 1. Dedicated MySQL 8.0 Database
  trustabac-mysql:
    image: mysql:8.0
    container_name: trustabac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-trustabac_iot}
      MYSQL_USER: ${DB_USERNAME:-trustabac}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - trustabac-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Local Ganache Ethereum Blockchain
  trustabac-ganache:
    image: trufflesuite/ganache:latest
    container_name: trustabac-ganache
    restart: unless-stopped
    command: >
      --wallet.deterministic
      --chain.chainId ${BLOCKCHAIN_CHAIN_ID:-1337}
      --chain.networkId ${BLOCKCHAIN_CHAIN_ID:-1337}
      --server.host 0.0.0.0
      --server.port 8545
    ports:
      - "${BLOCKCHAIN_PORT:-8545}:8545"
    networks:
      - trustabac-net

  # 3. RabbitMQ Message Broker (Phase 7C)
  trustabac-rabbitmq:
    image: rabbitmq:3-management
    container_name: trustabac-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - trustabac-net

  # NOTE: The TrustABAC-IoT Spring Boot application is launched natively via
  # START_DEMO.bat / start-demo.ps1 from a pre-built JAR file.
  # Use: ./mvnw.cmd clean package -DskipTests
  # Then: START_DEMO.bat
  # Docker Compose manages ONLY infrastructure services (MySQL, Ganache, RabbitMQ).

volumes:
  mysql_data:

networks:
  trustabac-net:
    driver: bridge
